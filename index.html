<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Status Tracker</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --text:#1f2328; --muted:#656d76; --border:#d0d7de; --accent:#0969da;
          --new:#1a7f37; --new-bg:#dafbe1; --upd:#bf8700; --upd-bg:#fff8c5; --step-bg:#f6f8fa; --depri:#6e7781; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --border:#30363d; --accent:#4493f8;
          --new:#3fb950; --new-bg:#12261e; --upd:#d29922; --upd-bg:#2b2111; --step-bg:#0d1117; --depri:#8d96a0; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; }
  .bar { display:flex; gap:8px; margin:16px 0; flex-wrap:wrap; }
  input { flex:1; min-width:220px; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--text); }
  button { padding:8px 12px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--text); cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .err { color:#cf222e; margin:8px 0; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-top:8px; overflow-x:auto; }
  .tab { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; padding:8px 12px; color:var(--muted); white-space:nowrap; }
  .tab.on { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .count { display:inline-block; min-width:18px; padding:0 6px; border-radius:9px; background:var(--upd); color:#fff; font-size:11px; line-height:18px; text-align:center; margin-left:4px; }
  .sechead { display:flex; justify-content:space-between; align-items:center; margin:16px 0 4px; gap:8px; }
  .sechead p { margin:0; color:var(--muted); font-size:13px; }
  .group { margin-top: 16px; }
  .group h2, details.depri-group summary { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display:flex; align-items:center; gap:8px; font-weight:600; }
  details.depri-group { margin-top: 24px; border-top: 1px dashed var(--border); padding-top: 12px; }
  details.depri-group summary { cursor:pointer; list-style:none; }
  details.depri-group summary::before { content:'▸'; }
  details.depri-group[open] summary::before { content:'▾'; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .pr { background:var(--card); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:8px; padding:7px 12px; margin-bottom:5px; }
  .toggle { border:none; background:none; padding:2px 0 0; font-size:12px; color:var(--muted); cursor:pointer; }
  .toggle:hover { color:var(--accent); }
  .toggle .arrow { display:inline-block; width:10px; }
  .toggle .tag { font-size:10px; font-weight:700; color:#fff; background:var(--upd); border-radius:8px; padding:0 5px; }
  .pr.new .toggle .tag { background:var(--new); }
  .pr.new { border-left-color:var(--new); background:var(--new-bg); }
  .pr.update { border-left-color:var(--upd); background:var(--upd-bg); }
  .pr.depri { opacity:.7; }
  .pr .top { display:flex; gap:12px; align-items:flex-start; }
  .pr a { color:var(--text); text-decoration:none; font-weight:600; }
  .pr a:hover { color:var(--accent); }
  .pr .sub { color:var(--muted); font-size:12px; }
  .pr .grow { flex:1; min-width:0; }
  .pr .actions { display:flex; gap:6px; flex:none; flex-wrap:wrap; justify-content:flex-end; }
  .pr .actions button { padding:3px 8px; font-size:12px; }
  .label { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; padding:1px 7px; border-radius:10px; color:#fff; margin-right:6px; vertical-align:1px; }
  .label.new { background:var(--new); }
  .label.update { background:var(--upd); }
  .label.depri { background:var(--depri); }
  .steps { margin-top:8px; background:var(--step-bg); border:1px solid var(--border); border-radius:6px; padding:6px 10px; }
  .pr.update .steps, .pr.new .steps { border-color:var(--upd); box-shadow:0 0 0 1px var(--upd) inset; }
  .pr.new .steps { border-color:var(--new); box-shadow:0 0 0 1px var(--new) inset; }
  .steps h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 4px; }
  .steps ol { margin:0; padding-left:20px; }
  .steps li { margin:2px 0; font-size:13px; overflow-wrap:anywhere; padding:1px 4px; border-radius:4px; }
  .steps li.fresh { background:var(--upd-bg); outline:1px solid var(--upd); font-weight:600; }
  .pr.new .steps li.fresh { background:var(--new-bg); outline-color:var(--new); }
  .steps li a { font-weight:inherit; color:var(--text); }
  .steps li a:hover { color:var(--accent); }
  .steps .tag { font-size:10px; font-weight:700; color:#fff; background:var(--upd); border-radius:8px; padding:0 5px; margin-right:4px; }
  .pr.new .steps .tag { background:var(--new); }
  .empty { color: var(--muted); padding: 24px 0; }
  @media (max-width: 600px) { .pr .top { flex-wrap:wrap; } .pr .actions { width:100%; justify-content:flex-start; } }
</style>
</head>
<body>
<main>
  <h1>PR Status Tracker</h1>
  <div class="meta" id="meta">Loading…</div>
  <div class="bar">
    <input id="pr" placeholder="Track a PR: https://github.com/owner/repo/pull/123 or owner/repo#123">
    <button class="primary" id="add">Track</button>
    <button id="refresh">Check now</button>
    <button id="test">Test pop-up</button>
  </div>
  <div class="err" id="err"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>
<script>
const ORDER = [
  ['Able to merge', '#1a7f37'],
  ['Ready for review — with comments', '#bc4c00'],
  ['Ready for review — awaiting review', '#0969da'],
  ['Draft — ready for review', '#8250df'],
  ['Draft — adversarial review comments', '#cf222e'],
  ['Draft — no adversarial review', '#6e7781'],
  ['Merged', '#8250df'],
  ['Closed', '#6e7781'],
];
const SECTIONS = [
  ['prs', 'My PRs'],
  ['mentions', 'Mentioned'],
  ['reviewing', 'Reviewing'],
];
let tab = 'prs', S = null, depriOpen = false;
try { tab = localStorage.getItem('tab') || 'prs'; depriOpen = localStorage.getItem('depriOpen') === '1'; } catch {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const ago = iso => { if (!iso) return 'never'; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };
const isDepri = ref => (S.deprioritised || []).includes(ref);
const flagged = sec => Object.entries(S?.[sec] || {}).filter(([ref, p]) => p.badge && !isDepri(ref)).length;

// Collapsed by default so more PRs fit on screen; open/closed is remembered per PR.
let openSteps = new Set();
try { openSteps = new Set(JSON.parse(localStorage.getItem('openSteps') || '[]')); } catch {}
const stepKey = (section, ref) => `${section}|${ref}`;

function stepsToggle(section, ref, p, depri) {
  if (!p.steps?.length) return '';
  const open = openSteps.has(stepKey(section, ref));
  const nNew = depri ? 0 : (p.newSteps || []).length;
  return `<button class="toggle" data-steps="${esc(stepKey(section, ref))}" aria-expanded="${open}">
    <span class="arrow">${open ? '▾' : '▸'}</span> Next steps (${p.steps.length})${nNew ? ` <span class="tag">${nNew} NEW</span>` : ''}</button>`;
}

function stepsBlock(section, ref, p) {
  if (!p.steps?.length || !openSteps.has(stepKey(section, ref))) return '';
  const fresh = new Set(p.newSteps || []);
  return `<div class="steps"><ol>${p.steps.map(s => {
    const isNew = fresh.has(s.id);
    const text = s.url ? `<a href="${esc(s.url)}" target="_blank">${esc(s.text)}</a>` : esc(s.text);
    return `<li class="${isNew ? 'fresh' : ''}">${isNew ? '<span class="tag">NEW</span>' : ''}${text}</li>`;
  }).join('')}</ol></div>`;
}

function row(section, ref, p, sub, extra = '') {
  const depri = isDepri(ref);
  const badge = depri ? null : p.badge;
  const labels = (badge ? `<span class="label ${badge}">${badge === 'new' ? 'NEW' : 'UPDATE'}</span>` : '')
    + (depri ? '<span class="label depri">DEPRIORITISED</span>' : '');
  const btns = (badge ? `<button data-dismiss="${esc(ref)}" data-section="${section}">Dismiss</button>` : '')
    + `<button data-depri="${esc(ref)}" data-on="${depri ? '0' : '1'}">${depri ? 'Reprioritise' : 'Deprioritise'}</button>` + extra;
  return `<div class="pr ${badge || ''} ${depri ? 'depri' : ''}"><div class="top"><div class="grow">
      ${labels}<a href="${esc(p.url)}" target="_blank">${esc(p.title)}</a>
      <div class="sub">${sub}</div>${stepsToggle(section, ref, p, depri)}</div>
      <div class="actions">${btns}</div></div>${stepsBlock(section, ref, p)}</div>`;
}

function head(section, blurb) {
  const n = flagged(section);
  return `<div class="sechead"><p>${blurb}</p>${n ? `<button data-dismiss-all="${section}">Dismiss all (${n})</button>` : ''}</div>`;
}

function depriGroup(rows) {
  if (!rows.length) return '';
  return `<details class="depri-group" ${depriOpen ? 'open' : ''}><summary><span class="dot" style="background:var(--depri)"></span>Deprioritised (${rows.length})</summary>${rows.join('')}</details>`;
}

const flaggedFirst = (a, b) => !!b.badge - !!a.badge;

function renderPRs() {
  const entries = Object.entries(S.prs);
  let out = head('prs', 'Your open PRs, plus any you track by hand. Flagged rows changed — new next steps are highlighted.');
  if (!entries.length) return out + '<div class="empty">No PRs tracked yet.</div>';
  const sub = (ref, p) => `${esc(ref)} · <b>${esc(p.status)}</b>${p.detail ? ' · ' + esc(p.detail) : ''}${p.badge === 'update' && p.changedFrom && p.changedFrom !== p.status ? ` · was <i>${esc(p.changedFrom)}</i>` : ''} · since ${ago(p.since)}`;
  const untrack = ref => S.manual.includes(ref) ? `<button data-untrack="${esc(ref)}">Untrack</button>` : '';
  const active = entries.filter(([ref]) => !isDepri(ref));
  out += ORDER.map(([status, color]) => {
    const rows = active.filter(([, p]) => p.status === status).sort(([, a], [, b]) => flaggedFirst(a, b));
    if (!rows.length) return '';
    return `<div class="group"><h2><span class="dot" style="background:${color}"></span>${esc(status)} (${rows.length})</h2>` +
      rows.map(([ref, p]) => row('prs', ref, p, sub(ref, p), untrack(ref))).join('') + '</div>';
  }).join('');
  if (!active.length) out += '<div class="empty">Everything is deprioritised.</div>';
  return out + depriGroup(entries.filter(([ref]) => isDepri(ref)).map(([ref, p]) => row('prs', ref, p, sub(ref, p), untrack(ref))));
}

function renderList(section, blurb, emptyText, subFn, sortFn) {
  const entries = Object.entries(S[section]).sort(([, a], [, b]) => flaggedFirst(a, b) || sortFn(a, b));
  let out = head(section, blurb);
  if (!entries.length) return out + `<div class="empty">${emptyText}</div>`;
  const active = entries.filter(([ref]) => !isDepri(ref));
  out += active.map(([ref, p]) => row(section, ref, p, subFn(ref, p))).join('');
  if (!active.length) out += '<div class="empty">Everything is deprioritised.</div>';
  return out + depriGroup(entries.filter(([ref]) => isDepri(ref)).map(([ref, p]) => row(section, ref, p, subFn(ref, p))));
}

const renderMentions = () => renderList('mentions',
  'Open PRs where someone @-mentioned you in the description or a comment.',
  'No open PRs mention you.',
  (ref, p) => `${esc(ref)} · by ${esc(p.author)} · ${p.count} mention${p.count === 1 ? '' : 's'}${p.latest ? ` · latest ${ago(p.latest.createdAt)} by ${esc(p.latest.author)}` : ''}`,
  (a, b) => String(b.latest?.createdAt || '').localeCompare(String(a.latest?.createdAt || '')));

const renderReviewing = () => renderList('reviewing',
  'Open PRs by others that you commented on or reviewed. Shows comments posted since your last one.',
  'You haven’t commented on any open PRs.',
  (ref, p) => `${esc(ref)} · by ${esc(p.author)} · ${p.newCount ? `<b>${p.newCount} new since your last comment</b>` : 'no new replies'}${p.myLast ? ` · you last commented ${ago(p.myLast)}` : ''}`,
  (a, b) => b.newCount - a.newCount);

function render() {
  if (!S) return;
  const total = SECTIONS.reduce((n, [k]) => n + flagged(k), 0);
  document.title = total ? `(${total}) PR Status Tracker` : 'PR Status Tracker';
  $('meta').textContent = `Last checked ${ago(S.lastPoll)} · every ${S.pollMinutes} min` + (S.login ? ` · signed in as ${S.login}` : '');
  $('err').textContent = S.lastError ? `Last poll failed: ${S.lastError}` : '';
  $('tabs').innerHTML = SECTIONS.map(([k, name]) => {
    const n = flagged(k);
    const active = Object.keys(S[k] || {}).filter(r => !isDepri(r)).length;
    return `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${name} (${active})${n ? `<span class="count">${n}</span>` : ''}</button>`;
  }).join('');
  $('list').innerHTML = { prs: renderPRs, mentions: renderMentions, reviewing: renderReviewing }[tab]();
  const d = document.querySelector('details.depri-group');
  if (d) d.ontoggle = () => { depriOpen = d.open; try { localStorage.setItem('depriOpen', depriOpen ? '1' : '0'); } catch {} };
}

async function load() { S = await (await fetch('/api/state')).json(); render(); }
const post = (url, data) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data || {}) });

$('add').onclick = async () => {
  const r = await post('/api/add', { pr: $('pr').value });
  const j = await r.json();
  if (!r.ok) { $('err').textContent = j.error; return; }
  $('pr').value = ''; tab = 'prs'; load();
};
$('pr').onkeydown = e => { if (e.key === 'Enter') $('add').click(); };
$('refresh').onclick = async () => { $('refresh').disabled = true; await post('/api/refresh'); $('refresh').disabled = false; load(); };
$('test').onclick = () => post('/api/test-notify');
$('tabs').onclick = e => { const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; try { localStorage.setItem('tab', tab); } catch {} render(); } };
$('list').onclick = async e => {
  const t = e.target.closest('[data-steps]');
  if (t) {
    const k = t.dataset.steps;
    openSteps.has(k) ? openSteps.delete(k) : openSteps.add(k);
    try { localStorage.setItem('openSteps', JSON.stringify([...openSteps])); } catch {}
    return render();
  }
  const d = e.target.dataset || {};
  if (d.dismiss) await post('/api/dismiss', { section: d.section, ref: d.dismiss });
  else if (d.dismissAll) await post('/api/dismiss', { section: d.dismissAll });
  else if (d.untrack) await post('/api/remove', { ref: d.untrack });
  else if (d.depri) await post('/api/deprioritise', { ref: d.depri, on: d.on === '1' });
  else return;
  load();
};
load(); setInterval(load, 30000);
</script>
</body>
</html>
